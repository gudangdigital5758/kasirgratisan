name: Deploy Profitku Cloud

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      admin: ${{ steps.filter.outputs.admin }}
      api: ${{ steps.filter.outputs.api }}
      admin_stack: ${{ steps.filter.outputs.admin_stack }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check path filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'tailwind.config.ts'
              - 'capacitor.config.ts'
              - 'package.json'
              - 'package-lock.json'
            admin:
              - 'admin/**'
            api:
              - 'workers/api/**'
            admin_stack:
              - 'admin/**'
              - 'workers/api/**'

  deploy-app:
    name: Deploy App (PWA)
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_AUTH_API_URL: ${{ secrets.VITE_AUTH_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=profitku

  deploy-admin:
    name: Deploy Admin Dashboard
    needs: [detect-changes, deploy-api]
    if: >-
      always() &&
      needs.detect-changes.outputs.admin_stack == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        run: npm ci
        working-directory: ./admin

      - name: Generate admin .env.production
        run: |
          cat > admin/.env.production << EOF
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          EOF

          node -e "require('fs').writeFileSync('admin/public/version.json', JSON.stringify({ commitHash: process.env.GITHUB_SHA, buildDate: new Date().toISOString() }, null, 2) + '\n')"
      - name: Build admin
        run: npm run build:prod
        working-directory: ./admin

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.54.0"
          command: pages deploy dist --project-name=profitku-admin --branch=main
          workingDirectory: "admin"

      - name: Verify Admin Deployment
        shell: bash
        run: |
          for attempt in {1..12}; do
            DEPLOYED_SHA=$(curl --fail --silent --show-error "https://dashboard.profitku.my.id/version.json?sha=${GITHUB_SHA}" | node -e "let body=''; process.stdin.on('data', chunk => body += chunk).on('end', () => console.log(JSON.parse(body).commitHash || ''))" || true)
            if [ "$DEPLOYED_SHA" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "dashboard.profitku.my.id belum menyajikan commit $GITHUB_SHA" >&2
          exit 1

  deploy-api:
    name: Deploy API Worker
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: ./workers/api

      - name: Type check
        run: npm run typecheck
        working-directory: ./workers/api

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.54.0"
          command: deploy
          workingDirectory: "workers/api"

      - name: Verify API Deployment
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 https://api.profitku.my.id/health > /dev/null
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" https://api.profitku.my.id/admin/api/settings)
          test "$STATUS" = "401"

  notify-success:
    name: Notify Success
    needs: [deploy-app, deploy-admin, deploy-api]
    if: always() && (needs.deploy-app.result == 'success' || needs.deploy-admin.result == 'success' || needs.deploy-api.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Deployment Summary ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Project | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| App (PWA) | ${{ needs.deploy-app.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin Dashboard | ${{ needs.deploy-admin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Worker | ${{ needs.deploy-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Cloudflare Dashboard](https://dash.cloudflare.com/)" >> $GITHUB_STEP_SUMMARY
