name: Deploy Profitku Cloud

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      admin: ${{ steps.filter.outputs.admin }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check path filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'tailwind.config.ts'
              - 'capacitor.config.ts'
              - 'package.json'
              - 'package-lock.json'
            admin:
              - 'admin/**'
            api:
              - 'workers/api/**'

  deploy-app:
    name: Deploy App (PWA)
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_AUTH_API_URL: ${{ secrets.VITE_AUTH_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=profitku

  check-admin:
    name: Check Admin Dashboard
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        run: npm ci
        working-directory: ./admin

      - name: Generate admin version metadata
        run: |
          node -e "require('fs').writeFileSync('admin/public/version.json', JSON.stringify({ commitHash: process.env.GITHUB_SHA, buildDate: new Date().toISOString() }, null, 2) + '\n')"
      - name: Build admin
        run: npm run build:prod
        working-directory: ./admin

  check-api:
    name: Check API Worker
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: ./workers/api

      - name: Type check
        run: npm run typecheck
        working-directory: ./workers/api

  notify-success:
    name: Notify Result
    needs: [deploy-app, check-admin, check-api]
    if: always() && (needs.deploy-app.result == 'success' || needs.check-admin.result == 'success' || needs.check-api.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Deployment Summary ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Project | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| App (PWA) | ${{ needs.deploy-app.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin Dashboard check | ${{ needs.check-admin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Worker check | ${{ needs.check-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Admin/API deploy automatically from their Cloudflare Git connections." >> $GITHUB_STEP_SUMMARY
