name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '*.md'
  pull_request:
    branches: [main]

# Nilai PUBLIC client (anon key, client id, onesignal) — aman di bundle, bukan secret.
env:
  VITE_AUTH_API_URL: https://api.profitku.my.id
  VITE_SUPABASE_URL: https://zrlcmoffzwpopuhopkju.supabase.co
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpybGNtb2Zmendwb3B1aG9wa2p1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MDIzNDcsImV4cCI6MjEwMDM3ODM0N30.0o288EowW0bhCt8yrAZq73lzGqfZWXU5bbwswWvpu-o
  VITE_GOOGLE_CLIENT_ID: 1040830182815-5pmkm6h03p9v0v8d7e3megblojhm73jc.apps.googleusercontent.com
  VITE_ONESIGNAL_APP_ID: f4c3717b-0f15-4d50-92aa-29a88f4f66ad

jobs:
  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_AUTH_API_URL: https://api.profitku.my.id

  api:
    name: API Worker (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsc --noEmit

  deploy:
    name: Deploy production (main only)
    if: github.ref == 'refs/heads/main'
    needs: [web, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install worker deps
        working-directory: workers/api
        run: npm ci
      - name: Install admin deps
        working-directory: admin
        run: npm ci
      - name: Deploy Worker
        working-directory: workers/api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build POS
        run: npm run build
      - name: Deploy POS (Pages profitku)
        working-directory: workers/api
        run: npx --no-install wrangler pages deploy ../../dist --project-name=profitku --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Admin (Pages profitku-admin)
        run: npm run admin:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          curl -sf https://api.profitku.my.id/health | grep -q '"ok":true'
          curl -sf https://api.profitku.my.id/api/app-settings/cloud_durations | grep -q 'cloud_durations'
          curl -sf "https://api.profitku.my.id/api/affiliate/lookup?code=PROFITKU" | grep -q '"valid":true'
          curl -sf https://profitku.my.id/sw.js -o /dev/null
          curl -sf https://dashboard.profitku.my.id/ -o /dev/null

