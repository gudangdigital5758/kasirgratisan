name = "profitku-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

# Custom domain (set di Cloudflare dashboard setelah deploy):
# api.profitku.my.id → this worker

[vars]
APP_ORIGIN = "https://profitku.my.id"
# Gateway pembayaran aktif: sumopod | midtrans | mock
PAYMENT_PROVIDER = "sumopod"
# Sinyal environment: "production" memblokir PAYMENT_PROVIDER=mock (BILL-006),
# /api/dev/* tanpa flag (SEC-003), dan cron tanpa WEBHOOK_SECRET.
ENVIRONMENT = "production"
# Dev routes (notify test) — jangan true di production.
ENABLE_DEV_ROUTES = "false"
# Fase release sync (M4): set "false" untuk menonaktifkan push/pull sementara.
SYNC_ENABLED = "true"
# Secrets: wrangler secret put SUPABASE_URL | SUPABASE_SERVICE_ROLE_KEY | SUPABASE_ANON_KEY
#          RESEND_API_KEY | RESEND_FROM | FONNTE_TOKEN | WEBHOOK_SECRET
#          ONESIGNAL_APP_ID | ONESIGNAL_REST_API_KEY | ADMIN_EMAILS | ADMIN_ORIGIN
#          PAYMENT_PROVIDER | MIDTRANS_SERVER_KEY | MIDTRANS_IS_PRODUCTION
#          SUMOPOD_API_KEY | SUMOPOD_WEBHOOK_SECRET | SUMOPOD_WEBHOOK_TOKEN
#          SUMOPOD_ALLOW_TOKEN_FALLBACK ("false" → Svix-only webhook, SEC-012)
#          AUTO_FAIL_STALE_PENDING ("true" → cron stale-pending menandai FAILED)

# Rate limit lintas-isolate (SEC-002) — dibuat via `wrangler kv namespace create RATE_LIMIT_KV`
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "f7efc1b43bcb43a697fae8febd916811"

# R2 backup (bucket dibuat: profitku-backups)
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "profitku-backups"

# Cron jobs setiap hari 01:00 UTC (~08:00 WIB)
# - Dunning H-3/H-1 subscription expiry reminder
# - Cleanup backup files > 30 hari (retention policy)
[triggers]
crons = ["0 1 * * *"]
